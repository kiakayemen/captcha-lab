{% extends "admin/change_list.html" %}

{% block object-tools-items %}
    <li>
        <form method="get" action="{% url 'admin:operations_scraperrun_download_all_logs' %}" style="display:flex;align-items:center;gap:6px;">
            <label for="log-start-date">Logs from</label>
            <input id="log-start-date" type="date" name="start_date" aria-label="Log start date">
            <label for="log-end-date">to</label>
            <input id="log-end-date" type="date" name="end_date" aria-label="Log end date">
            <button type="submit" class="button">Download CSV</button>
        </form>
    </li>
    <li>
        <form
            method="post"
            action="{% url 'admin:operations_scraperrun_run_now' %}"
            style="display: inline;"
        >
            {% csrf_token %}

            <button
                type="submit"
                class="addlink"
                style="
                    border: 0;
                    cursor: pointer;
                    font: inherit;
                "
            >
                Run scraper now
            </button>
        </form>
    </li>

    {{ block.super }}
{% endblock %}
